# Render blueprint for the Adaptive Enterprise Agent backend (FastAPI).
# Deploy: New → Blueprint → point at this repo. Render reads this file.
# Secrets are marked `sync: false` so Render never stores them in the repo — you enter
# them once in the Render dashboard (Environment tab). See docs/DEPLOYMENT.md.
services:
  - type: web
    name: aea-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/
    autoDeploy: true
    envVars:
      # --- non-secret config: safe to keep here ---
      - key: ENV
        value: production
      - key: DB_NAME
        value: app
      - key: GEMINI_MODELS
        value: gemini-3-flash-preview,gemini-3.5-flash,gemini-flash-lite-latest,gemini-3.6-flash
      - key: GEMINI_EMBED_MODEL
        value: gemini-embedding-001
      - key: SENDER_EMAIL
        value: onboarding@resend.dev
      # --- secrets & environment-specific values: set in the Render dashboard ---
      # MONGO_URL  → your MongoDB Atlas SRV connection string
      - key: MONGO_URL
        sync: false
      # CORS_ORIGINS → your exact Vercel URL, e.g. https://your-app.vercel.app
      #   (a wildcard '*' is rejected at startup in production)
      - key: CORS_ORIGINS
        sync: false
      # JWT_SECRET / APP_MASTER_KEY → generate with `openssl rand -hex 32`.
      #   APP_MASTER_KEY encrypts stored provider keys; never rotate it after first use.
      - key: JWT_SECRET
        generateValue: true
      - key: APP_MASTER_KEY
        sync: false
      # Optional email + demo-seed provider keys (leave unset to skip)
      - key: RESEND_API_KEY
        sync: false
      - key: SEED_GEMINI_API_KEY
        sync: false
      - key: SEED_QDRANT_API_KEY
        sync: false
      - key: SEED_QDRANT_URL
        sync: false
      - key: SEED_PAGEINDEX_API_KEY
        sync: false
